name: CLI Release Build

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'apps/cli/**'
    tags:
      - 'cli-v*'

jobs:
  build:
    name: Build CLI for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: arm64 # Can include if ARM64 Linux servers are targeted, but keep it standard
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache-dependency-path: 'apps/cli/go.sum'

      - name: Build CLI Binary
        working-directory: apps/cli
        run: |
          BINARY_NAME="infracanvas-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          
          echo "Building binary: ${BINARY_NAME}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o "${BINARY_NAME}" main.go
          
          # Move binary to root directory for artifact uploading
          mv "${BINARY_NAME}" ../../

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infracanvas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: infracanvas-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 7
